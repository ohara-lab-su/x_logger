[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
#name = "x_logger"
name = "xlogger-py"

version = "0.3.3"

description = "Python logging utilities with named loggers, rotating files, and multiprocessing-safe centralized log output."
authors = [
  { name="Kengo NAKADA", email="kengo.nakada@email.com" }
]
readme = "README.md"
#requires-python = ">=3.8"
requires-python = ">=3.7"

dependencies = [
"colorlog",
"coloredlogs",
#
"sphinx",
"myst-parser",
"sphinx-autobuild",
"sphinx-rtd-theme",
"sphinxcontrib-napoleon",
"linkify-it-py"
]

[project.urls]
Homepage = "https://ohara-lab-su.github.io/x_logger/"
Documentation = "https://ohara-lab-su.github.io/x_logger/"
Repository = "https://github.com/ohara-lab-su/x_logger"
Issues = "https://github.com/ohara-lab-su/x_logger/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"